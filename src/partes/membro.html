<article class="membro">
          <div class="membro__foto"><img src="/assets/img/equipe/{{foto}}" alt="{{nome}}" width="400" height="400" loading="lazy"></div>
          <div class="membro__info">
            <h3 class="t-titulo3">{{nome}}</h3>
            <p class="membro__cargo">{{cargo}}</p>
          </div>
          <div class="membro__formacao">
            <p class="rotulo rotulo--sem-traco">Formação e certificações</p>
            <p>{{formacao}}</p>
          </div>
          <p class="membro__email">e-mail a confirmar</p>
        </article>
