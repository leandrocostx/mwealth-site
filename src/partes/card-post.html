<article class="card-post {{extra}}" data-categoria="{{categoria}}">
          <a class="card-post__imagem" href="{{url}}" tabindex="-1" aria-hidden="true">
            <img src="{{imagem}}" alt="{{alt}}" width="1200" height="675" loading="lazy">
          </a>
          <p class="meta"><span class="meta__categoria">{{categoria}}</span><span class="meta__data">{{data}}</span></p>
          <h3 class="card-post__titulo t-titulo3"><a href="{{url}}">{{titulo}}</a></h3>
          <p class="card-post__resumo">{{resumo}}</p>
          <a class="link" href="{{url}}">Leia mais<span class="link__seta">→</span></a>
        </article>
