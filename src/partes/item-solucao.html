<div class="item-solucao {{aberto}}" data-item>
          <button class="item-solucao__cabeca" type="button" aria-expanded="false">
            <span class="item-solucao__numero">{{numero}}</span>
            <span class="item-solucao__titulo">{{titulo}}</span>
          </button>
          <div class="item-solucao__corpo">
            <div class="item-solucao__detalhe">
              <p>{{descricao}}<span class="so-desktop-inline">{{extra}}</span>.</p>
              <a class="link link--bege" href="/solucoes/{{ancora}}">Saiba mais<span class="link__seta">→</span></a>
            </div>
          </div>
          <span class="item-solucao__circulo" aria-hidden="true">
            <img class="item-solucao__mais" src="/assets/icones/mais.svg" alt="" width="20" height="20">
            <img class="item-solucao__seta" src="/assets/icones/seta-diagonal.svg" alt="" width="20" height="20">
          </span>
        </div>
