<!doctype html>
<html lang="pt-BR" id="topo">
<head>
  <!-- @parte head titulo="Aviso de Privacidade | M Wealth" descricao="Aviso de Privacidade da M Wealth: como tratamos seus dados pessoais, de acordo com a LGPD." -->
</head>
<body class="aviso-corpo">
  <!-- @parte cabecalho variante="interno" -->

  <!-- O texto vem do fornecedor de compliance (vsuitability), como no site atual: eles mantêm o conteúdo atualizado.
       A janela corta o fundo azul da página deles para a tela ficar toda branca (medidas em css/estilo.css). -->
  <main id="conteudo" class="aviso-pagina">
    <h1 class="sr-only">Aviso de Privacidade</h1>
    <div class="aviso-pagina__quadro">
      <div class="aviso-pagina__janela">
        <iframe src="https://www.vsuitability.com/mwealth-aviso" title="Aviso de Privacidade da M Wealth" referrerpolicy="no-referrer"></iframe>
      </div>
    </div>
  </main>

  <script>
    // largura da barra de rolagem deste navegador (a da página embutida é igual); usada no CSS do iframe
    (() => {
      const d = document.createElement('div');
      d.style.cssText = 'position:absolute;top:-999px;width:100px;height:100px;overflow:scroll';
      document.body.appendChild(d);
      document.documentElement.style.setProperty('--barra-rolagem', (d.offsetWidth - d.clientWidth) + 'px');
      d.remove();
    })();
  </script>

  <!-- @parte rodape -->
  <!-- @parte scripts -->
</body>
</html>
